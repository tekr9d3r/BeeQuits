services:
  - type: web
    name: beequits
    runtime: node
    plan: starter # always on: no cold starts for webhooks or judges
    region: frankfurt
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: DATABASE_URL
        fromDatabase:
          name: beequits-db
          property: connectionString
      - key: PAYPAL_API_BASE
        value: https://api-m.sandbox.paypal.com
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_REDIRECT_URI
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CHANNEL3_API_KEY
        sync: false

databases:
  - name: beequits-db
    plan: basic-256mb # free Postgres expires after 30 days, i.e. during judging
    region: frankfurt
    postgresMajorVersion: "16"
